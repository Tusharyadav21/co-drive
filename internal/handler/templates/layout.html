<!DOCTYPE html>
<html lang="en" class="{{if .User}}dark{{end}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Co-Drive - Collaborative Vehicle Management">
    <title>{{if .Title}}{{.Title}} - {{end}}Co-Drive</title>
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <script src="/static/js/app.js"></script>
    <script src="/static/js/htmx.min.js"></script>
    {{block "head" .}}{{end}}
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="font-sans antialiased bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-50 min-h-screen flex flex-col">
    {{block "flash" .}}{{end}}

    {{if .User}}
    <header class="sticky top-0 z-20 border-b border-zinc-200/50 bg-zinc-50/80 backdrop-blur-md dark:border-zinc-900/50 dark:bg-zinc-950/80">
        <div class="container mx-auto flex h-16 max-w-lg items-center justify-between px-4">
            <div class="flex items-center gap-2">
                <a href="/" class="flex items-center gap-2">
                    <div class="relative h-10 w-10 overflow-hidden rounded-xl">
                        <svg class="h-full w-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </div>
                    <span class="text-base font-bold tracking-tight">Co-Drive</span>
                </a>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 rounded-2xl border border-zinc-200/60 bg-white px-3 py-1.5 shadow-2xs dark:border-zinc-800 dark:bg-zinc-900">
                    <div class="flex h-6 w-6 items-center justify-center rounded-lg bg-indigo-500/10 text-xs font-bold text-indigo-600 dark:text-indigo-400">
                        {{.User.Name | firstLetters}}
                    </div>
                    <span class="max-w-[80px] truncate text-xs font-semibold text-zinc-600 dark:text-zinc-300">{{.User.Name}}</span>
                </div>
                <form action="/auth/logout" method="POST" class="inline">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <button type="submit" class="cursor-pointer rounded-xl border border-zinc-200/60 bg-white p-2 text-zinc-500 shadow-2xs transition-colors hover:text-zinc-800 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-200" title="Logout">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </header>
    {{end}}

    <main class="flex-1 container mx-auto max-w-lg px-4 py-6 w-full">
        {{template "content" .}}
    </main>

    {{if .User}}
    <nav class="fixed bottom-4 left-1/2 z-30 flex h-14 w-[calc(100%-32px)] max-w-sm -translate-x-1/2 items-center justify-around rounded-2xl border border-zinc-200/60 bg-white/80 px-4 shadow-lg backdrop-blur-md dark:border-zinc-900/50 dark:bg-zinc-950/80">
        <a href="/" class="flex cursor-pointer flex-col items-center gap-0.5 transition-colors {{if eq .ActiveTab "dashboard"}}font-bold text-indigo-600 dark:text-indigo-400{{else}}font-medium text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100{{end}}">
            <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[9px]">Workspace</span>
        </a>
        <a href="/vehicles/new" class="flex cursor-pointer flex-col items-center gap-0.5 transition-colors {{if eq .ActiveTab "new"}}font-bold text-indigo-600 dark:text-indigo-400{{else}}font-medium text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100{{end}}">
            <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span class="text-[9px]">New</span>
        </a>
        <a href="/profile" class="flex cursor-pointer flex-col items-center gap-0.5 transition-colors {{if eq .ActiveTab "profile"}}font-bold text-indigo-600 dark:text-indigo-400{{else}}font-medium text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100{{end}}">
            <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[9px]">Profile</span>
        </a>
    </nav>
    {{end}}

    <script src="/static/js/notifications.js"></script>

    {{block "scripts" .}}{{end}}
</body>
</html>
