{{define "title"}}Insurance Policy{{end}}

{{define "content"}}
<div class="min-h-screen bg-zinc-50 pb-16 dark:bg-zinc-950">
    <header class="sticky top-0 z-20 border-b border-zinc-200/50 bg-zinc-50/80 backdrop-blur-md dark:border-zinc-900/50 dark:bg-zinc-950/80">
        <div class="container mx-auto flex h-16 max-w-lg items-center gap-3 px-4">
            <a href="/vehicles/{{.VehicleID}}">
                <button class="cursor-pointer rounded-xl border border-zinc-200/60 bg-white p-2 text-zinc-500 shadow-2xs transition-colors hover:text-zinc-800 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-200">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
            </a>
            <span class="truncate text-sm leading-tight font-bold">Insurance Policy</span>
        </div>
    </header>

    <main class="container mx-auto max-w-lg px-4 py-6">
        <div class="overflow-hidden rounded-3xl border border-zinc-200/60 bg-white shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
            <div class="p-5 pb-2">
                <h2 class="text-lg font-bold tracking-tight text-zinc-800 dark:text-white">Insurance Policy</h2>
            </div>
            <div class="p-5 pt-2">
                <form method="POST" action="/vehicles/{{.VehicleID}}/insurance" class="flex flex-col gap-6">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <div class="flex flex-col gap-2">
                        <label for="expiry_date" class="text-sm font-medium">Expiry Date *</label>
                        <input type="date" id="expiry_date" name="expiry_date" value="{{if .Insurance}}{{.Insurance.ExpiryDate.Format "2006-01-02"}}{{end}}" required class="focus:ring-ring rounded-lg border px-3 py-2 text-sm focus:ring-2 focus:outline-none">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="provider" class="text-sm font-medium">Provider</label>
                        <input type="text" id="provider" name="provider" value="{{if .Insurance}}{{.Insurance.Provider}}{{end}}" placeholder="e.g., HDFC Insurance" class="focus:ring-ring rounded-lg border px-3 py-2 text-sm focus:ring-2 focus:outline-none">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="policy_number" class="text-sm font-medium">Policy Number</label>
                        <input type="text" id="policy_number" name="policy_number" value="{{if .Insurance}}{{.Insurance.PolicyNumber}}{{end}}" placeholder="e.g., POL123456" class="focus:ring-ring rounded-lg border px-3 py-2 text-sm focus:ring-2 focus:outline-none">
                    </div>

                    {{if .Error}}
                    <div class="bg-red-50 text-red-600 rounded-lg p-3 text-sm dark:bg-red-900/20 dark:text-red-400">{{.Error}}</div>
                    {{end}}

                    <button type="submit" class="h-12 cursor-pointer rounded-2xl bg-indigo-600 text-sm font-semibold text-white shadow-md shadow-indigo-600/10 transition-all hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">Save Insurance</button>
                </form>
            </div>
        </div>
    </main>
</div>
{{end}}
