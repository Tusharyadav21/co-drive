<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Drive | My Garage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-subtle: #F1F5F9;
            --border-color: #E2E8F0;
            --border-hover: #CBD5E1;
            --border-focus: #2563EB;
            --primary: #0F172A;
            --primary-hover: #1E293B;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;
            --success: #059669;
            --success-bg: #ECFDF5;
            --success-border: #A7F3D0;
            --warning: #D97706;
            --warning-bg: #FFFBEB;
            --warning-border: #FDE68A;
            --error: #E11D48;
            --error-bg: #FFF1F2;
            --error-border: #FECDD3;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-subtle: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .header-inner {
            max-width: 1140px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .logo-mark {
            width: 30px;
            height: 30px;
            background: var(--primary);
            color: #FFFFFF;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 6px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .btn-logout {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-logout:hover {
            background: #F1F5F9;
            color: var(--text-main);
        }

        main {
            flex: 1;
            max-width: 1140px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .btn-primary {
            padding: 10px 18px;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Vehicle Cards Grid */
        .garage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .vehicle-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color 0.15s ease;
        }

        .vehicle-card:hover {
            border-color: var(--border-hover);
        }

        .vehicle-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .vehicle-info h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .vehicle-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .plate-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 8px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            letter-spacing: 0.05em;
        }

        /* Low-Click Odometer Bar */
        .odometer-box {
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px;
        }

        .odo-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .odo-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .odo-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .quick-increment-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-quick-odo {
            flex: 1;
            padding: 6px 8px;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .btn-quick-odo:hover {
            background: var(--bg-subtle);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-custom-log {
            padding: 6px 10px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .btn-custom-log:hover {
            color: var(--text-main);
            background: #E2E8F0;
        }

        /* Metrics & Status Pills */
        .metrics-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .metric-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .metric-pill:hover {
            transform: translateY(-1px);
        }

        .pill-valid {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success);
        }

        .pill-warning {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning);
        }

        .pill-error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error);
        }

        .pill-efficiency {
            background: #EFF6FF;
            border: 1px solid #BFDBFE;
            color: #2563EB;
        }

        /* Inline Fuel Log Drawer */
        .inline-fuel-box {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .inline-fuel-box.open {
            display: flex;
        }

        .fuel-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .fuel-inputs input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            outline: none;
        }

        .fuel-inputs input:focus {
            border-color: var(--border-focus);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .btn-text {
            background: none;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            padding: 0;
        }

        .btn-text:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .btn-delete {
            color: var(--error);
        }

        .btn-delete:hover {
            color: #BE123C;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }

        .modal-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 28px;
            box-shadow: var(--shadow-modal);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-secondary {
            padding: 9px 16px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #E2E8F0;
        }

        /* Toast Notifications */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary);
            color: #FFFFFF;
            padding: 12px 18px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: var(--shadow-modal);
            display: none;
            z-index: 100;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 52px 24px;
            background: #FFFFFF;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.925rem;
            color: var(--text-muted);
            line-height: 1.55;
            max-width: 480px;
            margin: 0 auto 20px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-btn {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            color: var(--text-main);
            background: var(--bg-subtle);
        }

        .nav-btn.active {
            color: var(--text-main);
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="/" class="logo">
                    <div class="logo-mark">C</div>
                    Co-Drive
                </a>
                <nav class="nav-links">
                    <a href="/dashboard" class="nav-btn active">Garage</a>
                    <a href="/analytics" class="nav-btn">Mileage & Analytics</a>
                    <a href="/profile" class="nav-btn">Driver Profile</a>
                </nav>
            </div>
            <div class="header-actions">
                <a href="/profile" class="user-pill" style="text-decoration: none; color: inherit;">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <span id="user-email-text">user@example.com</span>
                </a>
                <button id="btn-logout" class="btn-logout">Sign Out</button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">My Garage</h1>
            <button id="btn-add-vehicle-modal" class="btn-primary">+ Add Vehicle</button>
        </div>

        <div id="garage-grid" class="garage-grid">
            <!-- Dynamic Vehicle Cards loaded via JS -->
        </div>
    </main>

    <!-- 1-Click Custom Mileage / Fuel Log Modal -->
    <div id="log-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="log-modal-title">Log Mileage & Fuel</h3>
                <button class="btn-close" onclick="closeModal('log-modal')">&times;</button>
            </div>
            <form id="log-form">
                <div class="form-group">
                    <label for="modal-odometer">New Odometer (km)</label>
                    <input type="number" id="modal-odometer" required min="0" step="1">
                </div>
                <div class="form-group">
                    <label for="modal-litres">Fuel Added (Litres - Optional)</label>
                    <input type="number" id="modal-litres" min="0" step="0.1" placeholder="e.g. 35.5">
                </div>
                <div class="form-group">
                    <label for="modal-cost">Cost ($ - Optional)</label>
                    <input type="number" id="modal-cost" min="0" step="0.01" placeholder="e.g. 45.00">
                </div>
                <div class="form-group">
                    <label for="modal-notes">Notes (Optional)</label>
                    <input type="text" id="modal-notes" placeholder="e.g. Highway trip refill">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('log-modal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Update Document (PUC/Insurance) Modal -->
    <div id="doc-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="doc-modal-title">Update Document</h3>
                <button class="btn-close" onclick="closeModal('doc-modal')">&times;</button>
            </div>
            <form id="doc-form">
                <div class="form-group">
                    <label id="doc-num-label" for="doc-num">Certificate / Policy Number</label>
                    <input type="text" id="doc-num" required placeholder="e.g. PUC-2026-9812">
                </div>
                <div class="form-group" id="doc-provider-group">
                    <label for="doc-provider">Provider / Insurer (Optional)</label>
                    <input type="text" id="doc-provider" placeholder="e.g. State Farm">
                </div>
                <div class="form-group">
                    <label for="doc-expiry">Expiration Date</label>
                    <input type="date" id="doc-expiry" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('doc-modal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Document</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Vehicle Modal -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Add New Vehicle</h3>
                <button class="btn-close" onclick="closeModal('add-modal')">&times;</button>
            </div>
            <form id="add-vehicle-form">
                <div class="form-group">
                    <label for="new-v-name">Vehicle Nickname</label>
                    <input type="text" id="new-v-name" required placeholder="e.g. Daily Honda City" autofocus>
                </div>
                <div class="form-group">
                    <label for="new-v-make">Make & Model</label>
                    <input type="text" id="new-v-make" placeholder="e.g. Honda Civic">
                </div>
                <div class="form-group">
                    <label for="new-v-year">Year</label>
                    <input type="number" id="new-v-year" min="1950" max="2035" value="2024">
                </div>
                <div class="form-group">
                    <label for="new-v-plate">License Plate</label>
                    <input type="text" id="new-v-plate" placeholder="e.g. DL 01 AB 1234">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('add-modal')">Cancel</button>
                    <button type="submit" class="btn-primary">Create Vehicle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script src="/static/api.js"></script>
    <script>
        let vehicles = [];
        let activeVehicleId = null;
        let activeDocType = 'PUC'; // 'PUC' or 'INSURANCE'

        const toastEl = document.getElementById('toast');

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.style.display = 'block';
            setTimeout(() => {
                toastEl.style.display = 'none';
            }, 3000);
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Close on Escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            }
        });

        // Initialize Dashboard
        async function init() {
            try {
                const user = await api('/api/users/me');
                if (user && user.email) {
                    document.getElementById('user-email-text').textContent = user.email;
                    document.getElementById('user-avatar').textContent = user.email.charAt(0).toUpperCase();
                }
            } catch (err) {
                window.location.href = '/auth';
                return;
            }

            await loadVehicles();
        }

        async function loadVehicles() {
            try {
                vehicles = await api('/api/vehicles');
                renderGarage();
            } catch (err) {
                showToast(err.message || 'Failed to load vehicles');
            }
        }

        function renderGarage() {
            const grid = document.getElementById('garage-grid');
            if (!vehicles || vehicles.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>Your garage is empty</h3>
                        <p>Add your first car or bike to start tracking mileage, fuel efficiency, and document renewals.</p>
                        <button class="btn-primary" onclick="openModal('add-modal')">+ Add Vehicle</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = vehicles.map(v => {
                const entries = v.mileage_entries || [];
                const lastEntry = entries.length > 0 ? entries[entries.length - 1] : null;
                const currentOdo = lastEntry ? lastEntry.mileage : 0;
                const efficiency = lastEntry ? (lastEntry.efficiency || 0) : 0;

                // Document Badges
                const puc = v.puc;
                const ins = v.insurance;

                let pucPill = `<span class="metric-pill pill-error" onclick="openDocModal('${v.id}', 'PUC')">📄 PUC: Missing</span>`;
                if (puc && puc.expiry_date) {
                    if (puc.is_expired) pucPill = `<span class="metric-pill pill-error" onclick="openDocModal('${v.id}', 'PUC')">⚠️ PUC Expired</span>`;
                    else if (puc.days_remaining <= 30) pucPill = `<span class="metric-pill pill-warning" onclick="openDocModal('${v.id}', 'PUC')">⏳ PUC (${puc.days_remaining}d left)</span>`;
                    else pucPill = `<span class="metric-pill pill-valid" onclick="openDocModal('${v.id}', 'PUC')">✓ PUC Valid</span>`;
                }

                let insPill = `<span class="metric-pill pill-error" onclick="openDocModal('${v.id}', 'INSURANCE')">🛡️ Insurance: Missing</span>`;
                if (ins && ins.expiry_date) {
                    if (ins.is_expired) insPill = `<span class="metric-pill pill-error" onclick="openDocModal('${v.id}', 'INSURANCE')">⚠️ Ins. Expired</span>`;
                    else if (ins.days_remaining <= 30) insPill = `<span class="metric-pill pill-warning" onclick="openDocModal('${v.id}', 'INSURANCE')">⏳ Ins. (${ins.days_remaining}d left)</span>`;
                    else insPill = `<span class="metric-pill pill-valid" onclick="openDocModal('${v.id}', 'INSURANCE')">✓ Ins. Valid</span>`;
                }

                const effPill = efficiency > 0 ? `<a href="/analytics?id=${v.id}" style="text-decoration: none;"><span class="metric-pill pill-efficiency">⚡ ${efficiency.toFixed(1)} km/L</span></a>` : `<span class="metric-pill pill-efficiency">⚡ First refill</span>`;

                return `
                    <div class="vehicle-card" id="card-${v.id}">
                        <div class="vehicle-top">
                            <div class="vehicle-info">
                                <h2>${escapeHtml(v.name)}</h2>
                                <div class="vehicle-sub">${escapeHtml(v.make || '')} ${escapeHtml(v.model || '')} ${v.year > 0 ? `(${v.year})` : ''}</div>
                            </div>
                            ${v.license_plate ? `<div class="plate-badge">${escapeHtml(v.license_plate)}</div>` : ''}
                        </div>

                        <!-- 1-Click Quick Odometer Bar -->
                        <div class="odometer-box">
                            <div class="odo-header">
                                <span class="odo-label">Current Odometer</span>
                                <span class="odo-value">${currentOdo.toLocaleString()} <span style="font-size: 0.85rem; font-weight: 500; color: var(--text-muted);">km</span></span>
                            </div>
                            <div class="quick-increment-group">
                                <button class="btn-quick-odo" onclick="quickAddOdometer('${v.id}', ${currentOdo}, 10)">+10 km</button>
                                <button class="btn-quick-odo" onclick="quickAddOdometer('${v.id}', ${currentOdo}, 50)">+50 km</button>
                                <button class="btn-quick-odo" onclick="quickAddOdometer('${v.id}', ${currentOdo}, 100)">+100 km</button>
                                <button class="btn-custom-log" onclick="openLogModal('${v.id}', ${currentOdo})">Edit</button>
                            </div>
                        </div>

                        <!-- Document & Efficiency Pills -->
                        <div class="metrics-row">
                            ${effPill}
                            ${pucPill}
                            ${insPill}
                        </div>

                        <!-- Card Footer -->
                        <div class="card-footer">
                            <button class="btn-text" onclick="toggleInlineFuel('${v.id}')">⛽ Quick Refill</button>
                            <a href="/analytics?id=${v.id}" class="btn-text" style="text-decoration: none; font-weight: 700;">📊 Mileage & Trends →</a>
                            <button class="btn-text btn-delete" onclick="deleteVehicle('${v.id}')">Delete</button>
                        </div>

                        <div id="inline-fuel-${v.id}" class="inline-fuel-box">
                            <div class="fuel-inputs">
                                <input type="number" id="fuel-litres-${v.id}" placeholder="Litres (e.g. 35)" min="0.1" step="0.1">
                                <input type="number" id="fuel-cost-${v.id}" placeholder="Cost ($)" min="0" step="0.01">
                                <input type="number" id="fuel-odo-${v.id}" value="${currentOdo}" placeholder="Odometer">
                            </div>
                            <button class="btn-primary" style="padding: 6px 12px; font-size: 0.8rem; width: 100%; justify-content: center;" onclick="submitInlineFuel('${v.id}')">Log Refill</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getDaysRemaining(expiryDateStr) {
            const exp = new Date(expiryDateStr);
            const now = new Date();
            const diffTime = exp - now;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 1-Click Quick Increment Odometer
        async function quickAddOdometer(vId, currentOdo, increment) {
            const newOdo = currentOdo + increment;
            try {
                await api(`/api/vehicles/${vId}/mileage`, {
                    method: 'POST',
                    body: {
                        odometer: newOdo,
                        notes: `Quick +${increment} km increment`
                    }
                });
                showToast(`Odometer updated to ${newOdo.toLocaleString()} km!`);
                await loadVehicles();
            } catch (err) {
                showToast(err.message || 'Failed to update mileage');
            }
        }

        function toggleInlineFuel(vId) {
            const el = document.getElementById(`inline-fuel-${vId}`);
            el.classList.toggle('open');
        }

        async function submitInlineFuel(vId) {
            const litres = parseFloat(document.getElementById(`fuel-litres-${vId}`).value);
            const cost = parseFloat(document.getElementById(`fuel-cost-${vId}`).value);
            const odo = parseInt(document.getElementById(`fuel-odo-${vId}`).value, 10);

            if (!litres || litres <= 0) return showToast('Please enter fuel litres');
            if (isNaN(odo) || odo < 0) return showToast('Please enter valid odometer');

            try {
                await api(`/api/vehicles/${vId}/mileage`, {
                    method: 'POST',
                    body: {
                        mileage: odo,
                        odometer: odo,
                        fuel_litres: litres,
                        litres: litres,
                        fuel_amount: isNaN(cost) ? 0 : cost,
                        cost: isNaN(cost) ? 0 : cost,
                        notes: 'Quick refill'
                    }
                });
                showToast('Fuel refill logged successfully!');
                await loadVehicles();
            } catch (err) {
                showToast(err.message || 'Failed to log refill');
            }
        }

        // Custom Odometer Modal
        function openLogModal(vId, currentOdo) {
            activeVehicleId = vId;
            document.getElementById('modal-odometer').value = currentOdo;
            document.getElementById('modal-litres').value = '';
            document.getElementById('modal-cost').value = '';
            document.getElementById('modal-notes').value = '';
            openModal('log-modal');
        }

        document.getElementById('log-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const odo = parseInt(document.getElementById('modal-odometer').value, 10);
            const litres = parseFloat(document.getElementById('modal-litres').value);
            const cost = parseFloat(document.getElementById('modal-cost').value);
            const notes = document.getElementById('modal-notes').value;

            const payload = { mileage: odo, odometer: odo, notes: notes };
            if (!isNaN(litres) && litres > 0) {
                payload.fuel_litres = litres;
                payload.litres = litres;
            }
            if (!isNaN(cost) && cost > 0) {
                payload.fuel_amount = cost;
                payload.cost = cost;
            }

            try {
                await api(`/api/vehicles/${activeVehicleId}/mileage`, {
                    method: 'POST',
                    body: payload
                });
                closeModal('log-modal');
                showToast('Odometer and fuel log saved!');
                await loadVehicles();
            } catch (err) {
                showToast(err.message || 'Failed to save log');
            }
        });

        // Document Update Modal
        function openDocModal(vId, docType) {
            activeVehicleId = vId;
            activeDocType = docType;
            document.getElementById('doc-modal-title').textContent = `Update ${docType}`;
            document.getElementById('doc-num-label').textContent = docType === 'PUC' ? 'Certificate Number' : 'Policy Number';
            document.getElementById('doc-provider-group').style.display = docType === 'PUC' ? 'none' : 'block';
            document.getElementById('doc-form').reset();
            openModal('doc-modal');
        }

        document.getElementById('doc-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const docNum = document.getElementById('doc-num').value.trim();
            const provider = document.getElementById('doc-provider').value.trim();
            const expiry = document.getElementById('doc-expiry').value;

            const endpoint = activeDocType === 'PUC' ? `/api/vehicles/${activeVehicleId}/puc` : `/api/vehicles/${activeVehicleId}/insurance`;
            const payload = {
                expiry_date: expiry
            };
            if (activeDocType === 'PUC') {
                payload.certificate_number = docNum;
            } else {
                payload.policy_number = docNum;
                payload.provider = provider;
            }

            try {
                await api(endpoint, {
                    method: 'POST',
                    body: payload
                });
                closeModal('doc-modal');
                showToast(`${activeDocType} updated!`);
                await loadVehicles();
            } catch (err) {
                showToast(err.message || 'Failed to update document');
            }
        });

        // Add Vehicle Form
        document.getElementById('btn-add-vehicle-modal').addEventListener('click', () => {
            document.getElementById('add-vehicle-form').reset();
            openModal('add-modal');
        });

        document.getElementById('add-vehicle-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api('/api/vehicles', {
                    method: 'POST',
                    body: {
                        name: document.getElementById('new-v-name').value.trim(),
                        make: document.getElementById('new-v-make').value.trim(),
                        year: parseInt(document.getElementById('new-v-year').value, 10) || 2024,
                        license_plate: document.getElementById('new-v-plate').value.trim()
                    }
                });
                closeModal('add-modal');
                showToast('Vehicle added to garage!');
                await loadVehicles();
            } catch (err) {
                showToast(err.message || 'Failed to add vehicle');
            }
        });

        // Delete Vehicle
        async function deleteVehicle(vId) {
            if (!confirm('Are you sure you want to delete this vehicle from your garage?')) return;
            try {
                await api(`/api/vehicles/${vId}`, { method: 'DELETE' });
                showToast('Vehicle removed');
                await loadVehicles();
            } catch (err) {
                showToast(err.message || 'Failed to delete vehicle');
            }
        }

        // Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await api('/api/auth/logout', { method: 'POST' });
            } catch (err) { }
            window.location.href = '/auth';
        });

        init();
    </script>
</body>

</html>
