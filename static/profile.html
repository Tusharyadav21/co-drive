<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Drive | Driver Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-subtle: #F1F5F9;
            --border-color: #E2E8F0;
            --border-hover: #CBD5E1;
            --border-focus: #2563EB;
            --primary: #0F172A;
            --primary-hover: #1E293B;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;
            --success: #059669;
            --success-bg: #ECFDF5;
            --success-border: #A7F3D0;
            --warning: #D97706;
            --warning-bg: #FFFBEB;
            --warning-border: #FDE68A;
            --error: #E11D48;
            --error-bg: #FFF1F2;
            --error-border: #FECDD3;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-subtle: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .header-inner {
            max-width: 1140px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .logo-mark {
            width: 30px;
            height: 30px;
            background: var(--primary);
            color: #FFFFFF;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-btn {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            color: var(--text-main);
            background: var(--bg-subtle);
        }

        .nav-btn.active {
            color: var(--text-main);
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 6px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: var(--accent);
            color: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .btn-logout {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-logout:hover {
            color: var(--error);
            border-color: var(--error-border);
            background: var(--error-bg);
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .page-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Profile Layout */
        .profile-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .profile-container {
                grid-template-columns: 1fr;
            }
        }

        .profile-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-card);
        }

        .avatar-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-large {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563EB, #0F172A);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
            margin-bottom: 14px;
            border: 4px solid #FFFFFF;
            outline: 2px solid var(--border-color);
        }

        .profile-name {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .profile-email {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
            margin-bottom: 12px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 99px;
            color: var(--success);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .member-since {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Form Styles */
        .form-section-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
            background: #FFFFFF;
            color: var(--text-main);
            transition: all 0.15s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-group input:disabled {
            background: var(--bg-subtle);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            padding: 10px 22px;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary);
            color: #FFFFFF;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 100;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(12px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="/dashboard" class="logo">
                    <div class="logo-mark">C</div>
                    Co-Drive
                </a>
                <nav class="nav-links">
                    <a href="/dashboard" class="nav-btn">Garage</a>
                    <a href="/analytics" class="nav-btn">Mileage & Analytics</a>
                    <a href="/profile" class="nav-btn active">Driver Profile</a>
                </nav>
            </div>
            <div class="header-actions">
                <a href="/profile" class="user-pill">
                    <div class="user-avatar" id="nav-user-avatar">D</div>
                    <span id="nav-user-name">Driver</span>
                </a>
                <button id="btn-logout" class="btn-logout">Sign Out</button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">Driver Profile</h1>
            <p class="page-desc">Manage your driver details, emergency contact, and account preferences.</p>
        </div>

        <div class="profile-container">
            <!-- Sidebar / Summary Card -->
            <div class="profile-card avatar-section">
                <div class="avatar-large" id="profile-avatar">D</div>
                <h2 class="profile-name" id="summary-full-name">Driver</h2>
                <p class="profile-email" id="summary-email">driver@example.com</p>
                <div class="verified-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Email Verified
                </div>
                <div class="member-since" id="member-since">
                    Member since: -
                </div>
            </div>

            <!-- Profile Edit Form -->
            <div class="profile-card">
                <form id="profile-form">
                    <div class="form-section-title">
                        <span>👤 Personal Identity</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="input-full-name">Display / Full Name</label>
                            <input type="text" id="input-full-name" placeholder="e.g. John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="input-email">Email Address (Read-only)</label>
                            <input type="email" id="input-email" disabled>
                        </div>
                    </div>

                    <div class="form-section-title">
                        <span>📞 Contact & Emergency Information</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="input-phone">Phone Number</label>
                            <input type="tel" id="input-phone" placeholder="e.g. +1 (555) 123-4567">
                        </div>
                        <div class="form-group">
                            <label for="input-emergency-contact">Emergency Contact</label>
                            <input type="text" id="input-emergency-contact"
                                placeholder="e.g. Jane Doe (+1 555-987-6543)">
                        </div>
                        <div class="form-group full-width">
                            <label for="input-address">Mailing / Garage Address</label>
                            <input type="text" id="input-address" placeholder="e.g. 123 Speedway Blvd, Austin, TX">
                        </div>
                    </div>

                    <div class="form-section-title">
                        <span>📝 Driver Notes & Bio</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="input-bio">Bio / Vehicle Ownership Notes</label>
                            <textarea id="input-bio"
                                placeholder="Add any details about your vehicles, driving habits, or notes..."></textarea>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
                        <button type="submit" id="btn-save" class="btn-primary">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        function getCookie(name) {
            const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
            return v ? v[2] : null;
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = isError ? 'var(--error)' : 'var(--primary)';
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3500);
        }

        async function fetchProfile() {
            try {
                const res = await fetch('/api/users/me');
                if (res.status === 401) {
                    window.location.href = '/auth';
                    return;
                }
                if (!res.ok) throw new Error('Failed to load profile');
                const data = await res.json();
                populateProfile(data);
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function populateProfile(p) {
            const name = p.full_name || 'Driver';
            const initial = name.charAt(0).toUpperCase() || 'D';

            // Nav Bar
            document.getElementById('nav-user-name').textContent = name;
            document.getElementById('nav-user-avatar').textContent = initial;

            // Summary Card
            document.getElementById('summary-full-name').textContent = name;
            document.getElementById('summary-email').textContent = p.email || '';
            document.getElementById('profile-avatar').textContent = initial;

            if (p.created_at) {
                const d = new Date(p.created_at);
                document.getElementById('member-since').textContent = 'Member since: ' + d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            }

            // Form
            document.getElementById('input-full-name').value = p.full_name || '';
            document.getElementById('input-email').value = p.email || '';
            document.getElementById('input-phone').value = p.phone || '';
            document.getElementById('input-emergency-contact').value = p.emergency_contact || '';
            document.getElementById('input-address').value = p.address || '';
            document.getElementById('input-bio').value = p.bio || '';
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const payload = {
                full_name: document.getElementById('input-full-name').value.trim(),
                phone: document.getElementById('input-phone').value.trim(),
                emergency_contact: document.getElementById('input-emergency-contact').value.trim(),
                address: document.getElementById('input-address').value.trim(),
                bio: document.getElementById('input-bio').value.trim()
            };

            try {
                const res = await fetch('/api/users/me', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': getCookie('csrf_token') || ''
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Failed to save changes');
                }

                const updated = await res.json();
                populateProfile(updated);
                showToast('Profile changes saved successfully!');
            } catch (err) {
                showToast(err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: { 'X-CSRF-Token': getCookie('csrf_token') || '' }
                });
            } finally {
                window.location.href = '/auth';
            }
        });

        // Initialize
        fetchProfile();
    </script>
</body>

</html>
