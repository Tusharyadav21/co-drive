name: Bug Report
description: File a bug report or reproducible defect in Co-Drive
title: "[Bug]: "
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help reproduce and fix the issue.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A concise description of the bug.
      placeholder: e.g., OTP verification fails with 500 when email contains uppercase characters
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '/auth'
        2. Enter email 'User@Example.com'
        3. Submit OTP code
        4. See error response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Terminal Output
      description: Paste any server console logs or browser devtools console output here.
      render: shell
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Backend (Server / API)"
        - "Frontend (UI / Layout / CSS)"
        - "Authentication (Email OTP / Sessions)"
        - "Database / Migrations (PostgreSQL)"
        - "Vehicles & Documents (PUC / Insurance / Mileage)"
        - "Other"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Verification
      options:
        - label: I have verified this behavior against the latest commit on `main`.
          required: false
